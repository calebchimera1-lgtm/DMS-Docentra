apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omniflow
resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - worker-deployment.yaml
  - redis-deployment.yaml
  - ingress.yaml
  - hpa.yaml

# secret.example.yaml is intentionally NOT listed here — copy it to
# secret.yaml, fill in real values, and `kubectl apply -f` it directly
# (or, better, manage secrets via your cluster's secrets-manager
# integration). Never let a real secret.yaml get picked up by this
# kustomization / committed to git.
