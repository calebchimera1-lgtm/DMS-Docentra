apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniflow-web
  labels:
    app: omniflow-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omniflow-web
  template:
    metadata:
      labels:
        app: omniflow-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: omniflow-web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: omniflow-web-config
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: omniflow-web
spec:
  selector:
    app: omniflow-web
  ports:
    - port: 3000
      targetPort: 3000
