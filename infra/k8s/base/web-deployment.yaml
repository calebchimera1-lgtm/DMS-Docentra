apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniflow-web
  labels:
    app: omniflow-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omniflow-web
  template:
    metadata:
      labels:
        app: omniflow-web
    spec:
      containers:
        - name: web
          image: omniflow-web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: omniflow-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: omniflow-web
spec:
  selector:
    app: omniflow-web
  ports:
    - port: 3000
      targetPort: 3000
