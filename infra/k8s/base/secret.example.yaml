# TEMPLATE — copy to secret.yaml, fill in real values, and apply with
# `kubectl apply -f` directly (kustomization.yaml intentionally does NOT
# reference secret.yaml, so it's never accidentally committed via a
# generator). In a real deployment, prefer a secrets manager integration
# (External Secrets Operator, Sealed Secrets, or your cloud provider's
# native CSI driver) over applying raw Secret manifests by hand.
apiVersion: v1
kind: Secret
metadata:
  name: omniflow-api-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/omniflow?schema=public&sslmode=require"
  REDIS_URL: "redis://HOST:6379"
  JWT_ACCESS_SECRET: "generate-a-long-random-value"
  JWT_REFRESH_SECRET: "generate-a-different-long-random-value"
  JWT_MFA_SECRET: "generate-another-long-random-value"
  ENCRYPTION_KEY: "generate-yet-another-long-random-value"
  S3_ACCESS_KEY_ID: "your-s3-access-key"
  S3_SECRET_ACCESS_KEY: "your-s3-secret-key"
  S3_ENDPOINT: "" # leave empty for real AWS S3; set for MinIO/other S3-compatible stores
  GOOGLE_CLIENT_ID: "" # optional — OAuth stays disabled until both are set
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_CALLBACK_URL: "https://api.example.com/api/v1/auth/oauth/google/callback"
---
apiVersion: v1
kind: Secret
metadata:
  name: omniflow-worker-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/omniflow?schema=public&sslmode=require"
  REDIS_URL: "redis://HOST:6379"
